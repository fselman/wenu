[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "wenu"
dynamic = ["version"]
description = "Celestial visualization toolkit"
authors = [
    { name = "Fernando Selman" },
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
    "pandas",
    "skyfield",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
wenu_chart = "wenu.cli.chart:main"
wenu_examples = "wenu.cli.examples:main"
wenu_notebooks = "wenu.cli.notebooks:main"

[tool.ruff]
line-length = 79
target-version = "py311"
exclude = [
    "src/wenu/notebooks",
]

[tool.pytest.ini_options]
addopts = "-p no:remotedata"
filterwarnings = [
    "error::FutureWarning",
]
markers = [
    "integration: crosses architectural component boundaries",
    "visual: validates rendered appearance or image structure",
    "slow: excluded from the normal development loop",
]

[tool.setuptools.package-data]
"wenu.configuration" = ["defaults.toml"]
"wenu.data" = ["*.json"]

[tool.setuptools_scm]
fallback_version = "0.8.0"
