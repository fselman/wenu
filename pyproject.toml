[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "wenu"
dynamic = ["version"]
description = "Celestial visualization toolkit"
authors = [
    { name = "Fernando Selman" },
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
    "pandas",
]

[project.scripts]
wenu_notebooks = "wenu.cli.notebooks:main"

[tool.setuptools_scm]
