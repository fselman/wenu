[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "wenu"
dynamic = ["version"]
description = "Celestial visualization toolkit"
authors = [
    { name = "Fernando Selman" },
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "wenu-kernel[geometry] @ git+https://github.com/fselman/wenu.git@f0a2e247d9ed0061d256891fcf4962d1c41fd4f9#subdirectory=packages/wenu_kernel",
    "astropy>=7,<8",
    "matplotlib",
    "pypdf>=6,<7",
    "numpy>=1.26,<2",
    "pandas",
    "skyfield",
    "tzdata>=2025.2",
    "sgp4>=2.25,<3",
    "spiceypy>=6,<9",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
wenu_chart = "wenu.cli.chart:main"
wenu_design_atlas = "wenu.cli.atlas:design_main"
wenu_plot_atlas = "wenu.cli.atlas:plot_main"
wenu_create_atlas = "wenu.cli.atlas:create_main"
wenu_retrieve_comets = "wenu.cli.comets:main"
wenu_examples = "wenu.cli.examples:main"
wenu_notebooks = "wenu.cli.notebooks:main"
wenu_satellite_crossings = "wenu.cli.satellite_crossings:main"

[tool.ruff]
line-length = 79
target-version = "py311"
exclude = [
    "src/wenu/notebooks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:remotedata"
pythonpath = ["."]
filterwarnings = [
    "error::FutureWarning",
]
markers = [
    "integration: crosses architectural component boundaries",
    "visual: validates rendered appearance, physical layout, or image structure",
    "slow: intrinsically expensive after accepted optimization",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["wenu.data.observing_lists*", "wenu.data.curated_catalogs*"]

[tool.setuptools.cmdclass]
build_py = "curated_catalogue_packaging.CuratedBuildPy"
sdist = "curated_catalogue_packaging.CuratedSdist"

[tool.setuptools]
py-modules = []

[tool.setuptools.exclude-package-data]
"*" = ["observing_lists/*", "observing_lists/**/*", "curated_catalogs/*", "curated_catalogs/**/*"]

[tool.setuptools.package-data]
"wenu.data.catalogs.hipparcos" = ["*.json", "ReadMe", "ReadMe_hip_main", "*.dat"]
"wenu.data.catalogs.caldwell" = ["*.ecsv", "*.csv", "*.json", "*.txt", "README.md"]
"wenu.data.catalogs.open_clusters" = ["*.ecsv", "*.csv", "*.json", "README.md"]
"wenu.data.catalogs.star_designations" = [
    "*.json", "README.md", "source/*.json.gz", "source/*.json", "source/*.rq",
]
"wenu.configuration" = ["defaults.toml", "presets/*.toml", "presets/*.json"]
"wenu.data" = ["*.json", "*.geojson", "*.csv"]
"wenu.data.satellites.snapshots.synthetic_50s4b_v1" = [
    "*.json",
    "README.md",
]
"wenu.data.isophotes.milky_way" = [
    "*.json", "*.geojson", "*.txt", "README.md",
]

[tool.setuptools_scm]
fallback_version = "0.8.0"

