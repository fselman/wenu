<svg xmlns="http://www.w3.org/2000/svg"
     width="1500" height="1120" viewBox="0 0 1500 1120"
     role="img"
     aria-labelledby="title description">
  <title id="title">Wenu v0.5 combined architecture</title>
  <desc id="description">
    Chart request resolution forms a control plane above the preserved
    catalogue, spherical geometry, projection, projected preparation,
    render-plan, renderer, and export data plane.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5963"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#286f9e"/>
    </marker>
    <style>
      .title { font: 700 30px Helvetica, Arial, sans-serif; fill: #263238; }
      .panel-title { font: 700 20px Helvetica, Arial, sans-serif; }
      .node-text { font: 16px Helvetica, Arial, sans-serif; fill: #263238;
                   text-anchor: middle; dominant-baseline: middle; }
      .small { font: 14px Helvetica, Arial, sans-serif; fill: #455a64;
               text-anchor: middle; }
      .control-box { fill: #eef6fc; stroke: #4f91c3; stroke-width: 2; rx: 12; }
      .data-box { fill: #f2f8ee; stroke: #74a957; stroke-width: 2; rx: 12; }
      .entry-box { fill: #fff4cc; stroke: #bd9a20; stroke-width: 2; rx: 12; }
      .panel-control { fill: #f8fbfe; stroke: #4f91c3; stroke-width: 3; rx: 18; }
      .panel-data { fill: #fbfdf9; stroke: #74a957; stroke-width: 3; rx: 18; }
      .flow { fill: none; stroke: #4f5963; stroke-width: 2;
              marker-end: url(#arrow); }
      .control-flow { fill: none; stroke: #286f9e; stroke-width: 2.4;
                      marker-end: url(#blue-arrow); }
      .control-label { font: 13px Helvetica, Arial, sans-serif;
                       fill: #286f9e; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1500" height="1120" fill="white"/>
  <text x="750" y="42" class="title" text-anchor="middle">
    Wenu v0.5 combined architecture
  </text>

  <rect x="40" y="70" width="1420" height="365" class="panel-control"/>
  <text x="70" y="102" class="panel-title" fill="#286f9e">
    CONTROL PLANE — chart request resolution
  </text>

  <rect x="600" y="90" width="300" height="58" class="entry-box"/>
  <text x="750" y="119" class="node-text">User / example chart request</text>

  <rect x="90" y="180" width="190" height="62" class="control-box"/>
  <text x="185" y="202" class="node-text">
    <tspan x="185" dy="0">Chart type +</tspan>
    <tspan x="185" dy="20">ChartContext</tspan>
  </text>
  <rect x="310" y="180" width="150" height="62" class="control-box"/>
  <text x="385" y="211" class="node-text">Observer</text>
  <rect x="490" y="180" width="160" height="62" class="control-box"/>
  <text x="570" y="211" class="node-text">Output mode</text>
  <rect x="680" y="180" width="160" height="62" class="control-box"/>
  <text x="760" y="211" class="node-text">Detail policy</text>
  <rect x="870" y="180" width="160" height="62" class="control-box"/>
  <text x="950" y="211" class="node-text">Chart style</text>
  <rect x="1060" y="180" width="160" height="62" class="control-box"/>
  <text x="1140" y="211" class="node-text">Legend policy</text>

  <rect x="570" y="270" width="360" height="62" class="control-box"/>
  <text x="750" y="301" class="node-text">
    Chart request / composition resolution
  </text>

  <rect x="65" y="360" width="240" height="54" class="control-box"/>
  <text x="185" y="387" class="node-text">Resolved sky-layer requests</text>
  <rect x="330" y="350" width="250" height="74" class="control-box"/>
  <text x="455" y="377" class="node-text">
    <tspan x="455" dy="0">Projection-domain, projection</tspan>
    <tspan x="455" dy="20">and viewport specification</tspan>
  </text>
  <rect x="605" y="350" width="290" height="74" class="control-box"/>
  <text x="750" y="377" class="node-text">
    <tspan x="750" dy="0">Projected-preparation and</tspan>
    <tspan x="750" dy="20">optional horizon specification</tspan>
  </text>
  <rect x="920" y="360" width="230" height="54" class="control-box"/>
  <text x="1035" y="387" class="node-text">Resolved visual specification</text>
  <rect x="1175" y="350" width="250" height="74" class="control-box"/>
  <text x="1300" y="377" class="node-text">
    <tspan x="1300" dy="0">Resolved legend and</tspan>
    <tspan x="1300" dy="20">export specification</tspan>
  </text>

  <path d="M750 148 L750 270" class="control-flow"/>
  <path d="M185 242 L185 255 L640 255 L640 270" class="control-flow"/>
  <path d="M385 242 L385 255 L680 255 L680 270" class="control-flow"/>
  <path d="M570 242 L570 255 L710 255 L710 270" class="control-flow"/>
  <path d="M760 242 L760 270" class="control-flow"/>
  <path d="M950 242 L950 255 L790 255 L790 270" class="control-flow"/>
  <path d="M1140 242 L1140 255 L840 255 L840 270" class="control-flow"/>
  <path d="M680 332 L185 360" class="control-flow"/>
  <path d="M715 332 L455 350" class="control-flow"/>
  <path d="M750 332 L750 350" class="control-flow"/>
  <path d="M785 332 L1035 360" class="control-flow"/>
  <path d="M820 332 L1300 350" class="control-flow"/>

  <rect x="40" y="465" width="1420" height="610" class="panel-data"/>
  <text x="70" y="498" class="panel-title" fill="#4f7f37">
    DATA PLANE — geometry and rendering
  </text>

  <rect x="570" y="520" width="360" height="54" class="data-box"/>
  <text x="750" y="547" class="node-text">Catalogues and sky definitions</text>
  <rect x="570" y="605" width="360" height="64" class="data-box"/>
  <text x="750" y="627" class="node-text">
    <tspan x="750" dy="0">CelestialSphere and</tspan>
    <tspan x="750" dy="20">registered sky layers</tspan>
  </text>
  <rect x="570" y="700" width="360" height="64" class="data-box"/>
  <text x="750" y="722" class="node-text">
    <tspan x="750" dy="0">Spherical scene</tspan>
    <tspan x="750" dy="20">layered spherical geometry</tspan>
  </text>

  <rect x="80" y="805" width="220" height="58" class="data-box"/>
  <text x="190" y="834" class="node-text">Projection-domain guard</text>
  <rect x="340" y="805" width="160" height="58" class="data-box"/>
  <text x="420" y="834" class="node-text">Projection</text>
  <rect x="540" y="795" width="260" height="78" class="data-box"/>
  <text x="670" y="824" class="node-text">
    <tspan x="670" dy="0">Projected scene</tspan>
    <tspan x="670" dy="20">layered projected geometry</tspan>
  </text>
  <rect x="840" y="795" width="270" height="78" class="data-box"/>
  <text x="975" y="824" class="node-text">
    <tspan x="975" dy="0">Projected-geometry</tspan>
    <tspan x="975" dy="20">preparation</tspan>
  </text>
  <rect x="1150" y="795" width="260" height="78" class="data-box"/>
  <text x="1280" y="824" class="node-text">
    <tspan x="1280" dy="0">Prepared</tspan>
    <tspan x="1280" dy="20">projected scene</tspan>
  </text>

  <rect x="395" y="930" width="230" height="58" class="data-box"/>
  <text x="510" y="959" class="node-text">Resolved render plan</text>
  <rect x="680" y="930" width="160" height="58" class="data-box"/>
  <text x="760" y="959" class="node-text">Renderer</text>
  <rect x="895" y="930" width="260" height="58" class="data-box"/>
  <text x="1025" y="959" class="node-text">Chart furniture and export</text>

  <path d="M750 574 L750 605" class="flow"/>
  <path d="M750 669 L750 700" class="flow"/>
  <path d="M690 764 L190 805" class="flow"/>
  <path d="M300 834 L340 834" class="flow"/>
  <path d="M500 834 L540 834" class="flow"/>
  <path d="M800 834 L840 834" class="flow"/>
  <path d="M1110 834 L1150 834" class="flow"/>
  <path d="M1280 873 L1280 905 L510 905 L510 930" class="flow"/>
  <path d="M625 959 L680 959" class="flow"/>
  <path d="M840 959 L895 959" class="flow"/>

  <path d="M185 414 L185 637 L570 637" class="control-flow"/>
  <text x="350" y="624" class="control-label">
    selection and spherical-geometry options
  </text>
  <path d="M385 242 L385 590 L570 620" class="control-flow"/>
  <text x="465" y="575" class="control-label">time, location, frame context</text>
  <path d="M455 424 L455 775 L190 805" class="control-flow"/>
  <path d="M455 424 L455 775 L420 805" class="control-flow"/>
  <path d="M750 424 L750 750 L975 795" class="control-flow"/>
  <text x="865" y="742" class="control-label">preparation controls</text>
  <path d="M1035 414 L1035 900 L510 930" class="control-flow"/>
  <path d="M1300 424 L1300 900 L1025 930" class="control-flow"/>

  <text x="750" y="1040" class="small">
    Solid grey arrows carry geometry and rendered output.
  </text>
  <text x="750" y="1062" class="small">
    Blue arrows carry resolved control specifications into existing stages.
  </text>
</svg>
