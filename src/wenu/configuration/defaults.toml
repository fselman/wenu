# Wenu authoritative public defaults
#
# Schema version 1. Values use public vocabulary rather than Python,
# Matplotlib, renderer, or catalogue implementation names. The initial
# runtime translation is added incrementally after this packaged document is
# characterized. "none" represents an intentional absent optional value.

schema_version = 1

# Observer defaults used by the canonical examples and future wenu_chart CLI.
[observer]
location = "La Ligua"
time = "2026-08-15 21:00"
elevation = "none"
timezone = "none"
ephemeris = "none"
data_directory = "none"

# Default subjects. Empty arrays mean that no subject is selected.
[subjects.all_sky]
kind = "none"

[subjects.planisphere]
kind = "none"

[subjects.regional_single]
kind = "constellations"
constellations = ["Cru"]

[subjects.regional_group]
kind = "constellations"
constellations = ["Sgr", "Sco", "Oph", "Ser"]
group = "none"

[subjects.circumpolar]
kind = "none"

[subjects.binocular]
kind = "target"
target = "centaurus-a"

# Chart-family geometry. Projection radii, boundary sampling, east-west flip,
# derived viewports, and automatic region framing remain Python invariants.
[families.all_sky]
projection = "mollweide"
coordinate_frame = "galactic"
position_angle = 0.0
mask = false

[families.planisphere]
projection = "stereographic"
coordinate_frame = "horizontal"
position_angle = 0.0
mask = false

[families.regional_single]
projection = "stereographic"
coordinate_frame = "horizontal"
position_angle = 0.0
mask = false
width = "none"
height = "none"

[families.regional_group]
projection = "stereographic"
coordinate_frame = "horizontal"
position_angle = 0.0
mask = false
width = "none"
height = "none"

[families.circumpolar]
projection = "stereographic"
coordinate_frame = "horizontal"
position_angle = 0.0
mask = false
pole = "south"
limiting_declination = -69.75

[families.binocular]
projection = "stereographic"
coordinate_frame = "horizontal"
position_angle = 0.0
mask = false
field_diameter = 6.5

# Neutral detail contains no ceilings until a family/product policy supplies
# them. Optional values use "none".
[detail.neutral]
star_magnitude_limit = "none"
galaxy_magnitude_limit = "none"
open_cluster_minimum_size = "none"
globular_cluster_minimum_size = "none"
planetary_nebula_minimum_size = "none"
supernova_remnant_minimum_size = "none"
extended_samples = "none"
label_density = 1.0
enabled_layers = "none"
grid_label_layers = []
constellation_star_mode = "none"
extra_stars = []

[detail.content]
default_layers = [
    "stars", "constellation_lines", "constellation_labels",
    "constellation_boundaries", "equatorial_grid", "ecliptic_grid",
    "galactic_grid", "altaz_grid", "milky_way", "magellanic_clouds",
    "galaxies", "globular_clusters", "open_clusters",
    "planetary_nebulae", "supernova_remnants",
]
cartoon_layers = [
    "stars", "constellation_lines", "constellation_labels",
    "milky_way", "magellanic_clouds", "galaxies",
    "globular_clusters", "open_clusters",
]

[detail.cartoon]
star_mode = "selected"
bright_limit = 3.0
extra_stars = []
deep_sky = false
named_star_labels = false
galaxy_magnitude_limit = 8.0
open_cluster_minimum_size = 60.0
globular_cluster_minimum_size = 30.0

[detail.polar_planisphere]
star_magnitude_limit = 5.5
label_density = 1.0
enabled_layers = [
    "stars", "constellation_lines", "constellation_labels", "milky_way",
    "magellanic_clouds", "nonstellar_objects", "galaxies",
    "globular_clusters", "open_clusters", "planetary_nebulae",
]
constellation_star_mode = "none"

[detail.adaptive]
reference_width = 7.0
magnitude_adjustment_per_octave = 0.20
maximum_adjustment = 0.50
adapt_layers = true

[[detail.adaptive.levels]]
span = 3.0
stars = 12.0
