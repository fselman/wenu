schema_version = 1
document_kind = "wenu-atlas-chart-presentation"
style = "atlas"
dpi = 150
star_magnitude_limit = 7.5
star_size_scale = 1.7
report_label_scale = 3.0
report_label_family = "sans-serif"
report_label_weight = "normal"
report_label_color = "black"
report_separator_width = 0.8
report_separator_gap_mm = 3.0
magnitude_veil_color = "white"
magnitude_veil_alpha = 0.65
chart_number_box_visible = true
chart_number_box_location = "upper right"
chart_number_box_facecolor = "white"
chart_number_box_edgecolor = "#777777"
chart_number_box_alpha = 0.9
chart_number_box_padding = 0.4
chart_number_box_borderpad = 0.0
# Physical coordinate frame; existing sky/stellar appearance is retained.
grid_lines_visible = true
grid_ra_step_hours = 1
grid_polar_ra_step_hours = 2
grid_minute_labels_visible = false
milky_way_color = "#87CEFA"
legend_fontsize = 12.0
messier_label_fontsize = 7.0
deep_sky_symbol_scale = 1.8
cluster_face_color = "yellow"
grid_dec_label_scale = 0.8
grid_label_fontsize = 12.0
grid_minor_label_scale = 0.75
grid_frame_width_scale = 1.0
formats = ["png", "pdf", "svg"]
layers = ["stars", "constellation_lines", "constellation_labels",
  "constellation_boundaries", "milky_way", "magellanic_clouds", "nonstellar",
  "galaxies", "open_clusters", "globular_clusters", "supernova_remnants",
  "planetary_nebulae", "equatorial_grid"]


# Curated PN atlas review: 25% larger diameter and higher contrast.
planetary_nebula_symbol_scale = 1.25
planetary_nebula_color = "#24552b"
planetary_nebula_linewidth = 1.1
open_cluster_angular_sizes = true
open_cluster_exclude_infrared_embedded = false

[stellar_magnitude_sizing]
algorithm = "quadratic"
a_mm = 0.04
b_mag = 3.0
dmin_mm = 0.3
size_reference_magnitude = 8.0
