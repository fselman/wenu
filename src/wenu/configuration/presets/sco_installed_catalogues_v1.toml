# Scorpius review using installed catalogue defaults, v1.
# Retain the curated small-object population for visual inspection.
schema_version = 2

[detail.adaptive]
adapt_layers = false

[[detail.adaptive.levels]]
span = 3.0
stars = 7.0
galaxies = 11.0
open_clusters = 0.000001
globular_clusters = 0.000001
planetary_nebulae = 0.000001
supernova_remnants = 0.000001
label_density = 1.0

[[detail.adaptive.levels]]
span = 180.0
stars = 7.0
galaxies = 11.0
open_clusters = 0.000001
globular_clusters = 0.000001
planetary_nebulae = 0.000001
supernova_remnants = 0.000001
label_density = 1.0

[styles.atlas.open_cluster]
draw_labels = true

[styles.atlas.globular_cluster]
draw_labels = true

[styles.atlas.planetary_nebula]
draw_labels = true
color = "#24552b"
line_width = 1.1
symbol_size = 28.125
opacity = 1.0

[styles.atlas.galaxy]
draw_labels = true

[styles.atlas.supernova_remnant]
draw_labels = true
